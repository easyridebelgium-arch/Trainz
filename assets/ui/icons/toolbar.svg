      <path d="M16 4V20"></path>
      <path d="M10 14L16 20L22 14"></path>
      <path d="M5 21V28H27V21"></path>
    </g>

    <!-- 8: Save folder -->
    <g transform="translate(256 0)">
      <path d="M4 9H13L16 12H28V27H4Z"></path>
      <path d="M4 9V6H13L16 9H26V12"></path>
    </g>

    <!-- 9: Previous save -->
    <g transform="translate(288 0)">
      <path d="M7 11A10 10 0 1 1 6 22"></path>
      <path d="M7 5V12H2"></path>
      <path d="M16 11V18H21"></path>
